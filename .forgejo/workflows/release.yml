name: release
# Runs only when a release is published (or by hand from the Actions tab), so the one worker isn't busy on every
# push. Everything runs here, the sim UI tests too (no Xeon to share them with): slower, but complete. Two files go
# out: the user build (tx) as one update file, ferrite-VERSION.ffw (decision 335: the image and its SPI parts, signed
# inside), Console's backup reader and its restorer (Back to stock without Ferrite), with the build report.
# The receive-only and tx-bench images aren't built here (tx-bench is for local bench work only).
on:
  release:
    types: [published]
  workflow_dispatch:

# One at a time: a second release waits for the first rather than sharing the worker.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: docker
    container:
      image: node:20-bookworm # checkout needs node; the rest is installed below
    timeout-minutes: 240
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - name: Packages
        run: |
          apt-get update -q
          # python3: the tools (stdlib only); binutils-arm-none-eabi: slowcheck and the build report;
          # the X11/Wayland headers: the simulator's window library (minifb) builds against them, even headless.
          apt-get install -y -q --no-install-recommends python3 binutils-arm-none-eabi pkg-config \
            libx11-dev libxkbcommon-dev libwayland-dev libxcursor-dev libxrandr-dev libxi-dev
      - name: Rust (the nightly pinned in rust-toolchain.toml)
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y -q --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install # reads rust-toolchain.toml
          "$HOME/.cargo/bin/cargo" install -q --locked cargo-llvm-cov # the build report's coverage
          # nextest runs the test binaries in parallel: the covered host tests 233 -> 29 s on the Mac (Nov 11, 2026)
          curl -LsSf https://get.nexte.st/0.9.151/linux | tar zxf - -C "$HOME/.cargo/bin"

      - name: Host tests
        run: |
          # Run once, under coverage: the build report counts these logs and reports this run's coverage. The store's
          # power-cut and chip-gone tests run about 40 times slower instrumented (11 s plain, over 7 min covered), so
          # they're skipped here and run plainly in the bench build below (store coverage 96.7 -> 92.7 %).
          mkdir -p target/ci
          cargo llvm-cov nextest --no-report -E 'not (test(chip_gone) | test(power_cut))' 2>&1 | tee target/ci/host-tests.log
          cargo llvm-cov nextest --no-report -p uradio-bus -p bk4829 -p si4732 -p st7789 -p w25q -p keypad -p nmea \
            --all-features 2>&1 | tee target/ci/driver-tests.log
          cargo nextest run --features ferrite-app/bench,ferrite-radio/bench,ferrite-sim/bench
          # the update file's installer checks (UPD-20 - UPD-24)
          python3 -m unittest tools/test_ffw.py
      - name: Lints
        run: |
          cargo clippy -q --all-targets -- -D warnings
          cargo clippy -q --all-targets --features ferrite-app/bench,ferrite-radio/bench,ferrite-sim/bench -- -D warnings
          cargo fw-clippy -q -- -D warnings
          cargo fw-clippy -q --features tx -- -D warnings
          cargo fw-clippy -q --features tx-bench -- -D warnings
          cargo fw-clippy -q --features bench -- -D warnings
          python3 tools/thirdparty.py --check # the release's licence notices match what the image links
      - name: Sim UI tests
        run: python3 tools/uitest.py --sim auto -j "$(nproc)" --results target/ci-ui

      # Every run, by hand too, keeps target/out as a download on the run's page: the update file, the reader image,
      # SHA256SUMS, their signatures and the build report.
      # SELF-5.1 (decision 466): only a published release's image is an official build; a run by hand, like every
      # local build, says "Unofficial build" on About. Set here only: the tests and the sim run above stay unofficial,
      # as their screenshots expect.
      - name: Images
        env:
          FERRITE_OFFICIAL: ${{ github.event_name == 'release' && '1' || '' }}
        run: |
          tools/mkbtf.sh tx
          # the release's image must say so (the build report reads the same marker)
          if [ "$FERRITE_OFFICIAL" = 1 ] && grep -q "Unofficial build" target/ferrite-tx.bin; then
            echo "not an official build: FERRITE_OFFICIAL didn't reach the firmware"; exit 1
          fi
          tools/mkbtf.sh reader
          tools/mkbtf.sh restorer # Back to stock without Ferrite running (BACKUP-13)
          # The release tag without a leading v (v0.9 -> ferrite-0.9.btf); a run by hand uses the commit.
          tag="${{ github.event.release.tag_name }}"
          ver="${tag#v}"
          mkdir -p target/out
          # the .btf goes inside the .ffw (anyone with another flasher can unzip it)
          cp target/ferrite-tx.ffw "target/out/ferrite-${ver:-$(git rev-parse --short HEAD)}.ffw"
          cp target/ferrite-reader.btf target/ferrite-restorer.btf target/out/
      # Signed with minisign once the MINISIGN_KEY secret is set (the secret key file's contents, made without a
      # password: minisign -G -W; the public key ships in Console): the .ffw's manifest (its signature goes inside, as
      # manifest.minisig, UPD-21), then the reader image and SHA256SUMS (a .minisig beside each). SHA256SUMS is made
      # after the .ffw is signed, so it covers the file as shipped.
      - name: Sign
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          apt-get install -y -q --no-install-recommends minisign # also the build report's check
          if [ -z "$MINISIGN_KEY" ]; then
            echo "no MINISIGN_KEY secret: not signed"
            (cd target/out && sha256sum *.ffw *.btf > SHA256SUMS)
            exit 0
          fi
          # The key file from the secret, whole or only its base64 line, wrapped or not (tools/minisign-key.sh;
          # sign-check.yml tests the secret alone in a minute).
          key=$(mktemp)
          tools/minisign-key.sh "$key"
          cd target/out
          comment="Ferrite ${TAG:-build} $(git rev-parse --short HEAD)"
          for f in *.ffw; do
            python3 ../../tools/ffw.py manifest "$f" > manifest.json
            minisign -S -s "$key" -t "$comment" -m manifest.json
            python3 ../../tools/ffw.py add-sig "$f" manifest.json.minisig
            rm manifest.json manifest.json.minisig
            python3 ../../tools/ffw.py check "$f" # the installers' check: the release key, every hash
          done
          sha256sum *.ffw *.btf > SHA256SUMS
          minisign -S -s "$key" -t "$comment" -m *.btf SHA256SUMS
          rm "$key"
          # Each signature checked against the public key in the repo (the one Console carries): a wrong secret fails here.
          for f in *.btf SHA256SUMS; do minisign -Vqm "$f" -p ../../minisign.pub; done
          echo "signed: $(ls *.ffw *.minisig | tr '\n' ' ')"
      # Only reads what the steps above made (the tests' logs and coverage, the UI results, the image and its
      # signature): nothing is built or run again.
      - name: Build report
        run: |
          ui=$(ls -t target/ci-ui/*/ui/results.json | head -1)
          sig=$(ls target/out/ferrite-*.ffw 2>/dev/null | head -1)
          python3 tools/buildreport.py tx --no-build --ui "$ui" ${sig:+--sig "$sig"} \
            --from-logs target/ci/host-tests.log target/ci/driver-tests.log
          # Only the tx build ships, so the report drops the build from its name.
          cp target/build-report-tx.html target/out/build-report.html
          cp target/build-report-tx.json target/out/build-report.json
          cp THIRD-PARTY-LICENSES.md target/out/
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: ferrite-images.zip # the download is a zip; Forgejo names the file after this
          path: target/out/

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          # RELEASE_TOKEN (a repository secret with write access to releases) if set, else the run's own token.
          TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases/${{ github.event.release.id }}/assets
        run: |
          cd target/out
          for f in *.ffw *.btf *.minisig SHA256SUMS build-report.html THIRD-PARTY-LICENSES.md; do # build-report.json: the run's download only
            curl -sSf -X POST -H "Authorization: token $TOKEN" -F "attachment=@$f" "$API?name=$f" > /dev/null
            echo "attached $f"
          done
