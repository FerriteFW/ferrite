[package]
name = "ferrite-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Ferrite's UI state machine: keys and the radio's snapshot in, radio commands and screen redraws out; shared by the firmware's UI task and the simulator"

[features]
default = ["vt100", "line-cmds"]
# The terminal's full-screen VT100 pages (decision 342): templates in a pack (`src/term/pages.vt`, compiled by
# build.rs) and their interpreter. Without it the cable terminal is a plain command line; the line commands
# (TERM-12), dump and load stay either way (Console and the tools use them).
vt100 = []
# The terminal's bench commands (decision 151): `txtest`, `bk`, `si`, `mem`, `gpio`, `rx`, `mic`, `bt` and the raw
# `gps` sends. Without it they are known by name only and refused ("not in this build").
bench = ["ferrite-core/bench", "line-cmds"]
# The line commands (TERM-12; decision 347): the terminal's command line, `CMD` over the link (LINK-34), dump and
# load. On by default (Console's scratch radio and the simulator use them) and in bench builds; a user build leaves
# them out: `CMD` and the command line answer "not in this build", Console uses the records (caps2 RADIO).
line-cmds = []

[dependencies]
ufmt.workspace = true
ferrite-core.workspace = true
ferrite-ui.workspace = true
uaprs.workspace = true # smart beaconing (APRS-24)

[dev-dependencies]
ferrite-ui = { workspace = true, features = ["std", "clipcheck"] }
ferrite-fuzzkit.workspace = true
uafsk.workspace = true
ufx25.workspace = true

[lints]
workspace = true
