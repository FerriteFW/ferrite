[package]
name = "bk4829"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "BK4829 FM transceiver driver: 3-wire bus, stock's start-up, tuning, squelch, CTCSS/DCS, DTMF, FSK modem; transmit only with the tx feature"

[features]
# Transmit: keying, PA, sub-tone and DTMF and FSK sending. Without it, a build cannot key a transmitter.
tx = []

[dependencies]
uradio-bus = { path = "../bus" }

[lints]
workspace = true

[dev-dependencies]
ferrite-fuzzkit.workspace = true
