[package]
name = "ferrite"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Ferrite firmware for the Radtel RT-950 Pro: start-up, the HAL, and the six tasks"

[[bin]]
name = "ferrite"
path = "src/main.rs"
test = false
bench = false

[features]
# Satellite mode predicts passes on the radio (SGP4 and the pass predictor, SAT-4, SAT-6); without it the radio
# only reads the passes and tracks Console computes (`ferrite_core::sat::track`).
default = ["sat-predict", "vt100"]
sat-predict = []
# The terminal's full-screen VT100 pages (decision 342); without them the cable terminal is a plain command line.
# The line commands, dump and load are in every build. `tools/mkbtf.sh tx no-vt100` builds without.
vt100 = ["ferrite-app/vt100"]
# Transmit. Off until milestone 4: without it the build has no transmit code at all (the bk4829 crate's tx feature).
tx = ["bk4829/tx", "ferrite-radio/tx"]
# The bench radio's build (decision 193): the full-power transmit build with the bench commands, starting every
# power-on with Dry TX on (TX-48.1: the PA drive held at 0 until turned off by hand at 0 8 8 5), so the SDR bench
# keys it dry and a real-power key-up is a deliberate step. Replaced the tx-dry build (the PA held at 0 at build
# time). `cargo fw --features tx-bench`; `tools/mkbtf.sh tx-bench`.
tx-bench = ["tx", "bench"]
# The first builds on a new radio (roadmap 1c): nothing is ever written to or erased from the SPI flash (settings
# live in RAM for the power-on), any key held through the boot screen opens the key test, and the cable prints a
# plain log (boot report, every raw key code, the receiver, faults) until a byte arrives, then the terminal takes
# over. `cargo fw-bringup`; `tools/mkbtf.sh bringup` packs it.
bringup = ["bench"]
# The bench commands (decision 151, Appendix "Build flavours"): `txtest` and its generators (the DSP task's test
# playback, the suite, `afsk-bk` and its TMR5 bit clock), raw chip and memory access (`bk`, `si`, `mem`, `gpio`),
# `rx both`, `mic`, the raw GPS sends and the Bluetooth queries. In the bring-up and tx-bench builds; the receive and
# tx builds a user installs leave them out (their terminal says "not in this build").
bench = ["ferrite-core/bench", "ferrite-app/bench", "ferrite-radio/bench", "ferrite-ui/prof", "cable-log", "line-cmds"]
# The line commands (decision 347): bench builds only; a user build's Console uses the binary records.
line-cmds = ["ferrite-app/line-cmds"]
# The cable log (TERM-28): bench builds only (Alex, Nov 3, 2026); without it `bringup::line`/`linef` compile to
# nothing. A fault's report (`bringup::fault`) prints in every build.
cable-log = []
# The core clock for the power bench (Oct 21, 2026): one fixed speed per image instead of stock's 120 MHz
# (hal/clock.rs). `tools/mkbtf.sh tx-bench clock-240` builds target/ferrite-txbench-240.btf.
clock-24 = []
clock-48 = []
clock-96 = []
clock-144 = []
clock-192 = []
clock-240 = []

[dependencies]
ferrite-core.workspace = true
usstv.workspace = true
ferrite-ui.workspace = true
ferrite-app.workspace = true
ferrite-store.workspace = true
ferrite-radio.workspace = true
ufmt.workspace = true
uradio-bus.workspace = true
bk4829.workspace = true
si4732.workspace = true
st7789.workspace = true
w25q = { workspace = true, features = ["write"] }
keypad.workspace = true
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = { version = "0.7.5", features = ["set-sp", "set-vtor", "device"] }
critical-section = "1.2"
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "executor-interrupt"] }
embassy-sync.workspace = true
embassy-futures = "0.1"
embassy-time = "0.5"
embassy-time-driver = { version = "0.2", features = ["tick-hz-2_000"] }
embassy-time-queue-utils = "0.3"

[lints]
workspace = true
